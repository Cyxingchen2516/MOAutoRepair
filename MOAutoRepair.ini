; ============================================================================
; MOAutoRepair - 心灵终结独立自动维修插件
; 把 MOAutoRepair.dll 和本文件放在游戏根目录, Syringe (Ares 注射器) 会自动加载。
; 删除本文件 = 全部使用默认值。
; ============================================================================

[AutoRepair]
; 1 = 启用自动维修; 0 = 关闭(插件完全不动作)
Enable=1

; 扫描间隔(游戏逻辑帧)。30 ≈ 1 秒; 数字越小反应越快, 事件也越密。
; 允许范围 5 ~ 600。
Interval=30

; 每个逻辑帧最多向引擎发送多少条维修事件。允许范围 1 ~ 96。
Batch=24

; 1 = 写日志 MOAutoRepair.log (排查/确认用); 0 = 不写。
Log=1
